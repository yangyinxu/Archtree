version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 24
      python: 3.12
  build:
    commands:
      # Actions read access may be supplied as GITHUB_ARTIFACT_TOKEN through Secrets Manager.
      # Missing, pending or failed exact-main gates fail closed; this path never rebuilds.
      - node scripts/check-runtime.mjs --linux
      - node scripts/promote-eb-artifact.mjs

artifacts:
  base-directory: elastic-beanstalk-artifact
  files:
    - '**/*'
