version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - npm ci
  build:
    commands:
      - npm test
      - npm run build --if-present
  post_build:
    commands:
      - npm run stage:eb-artifact
      - echo "Validated Elastic Beanstalk artifact staged. Runtime startup is handled by the deployment target."

artifacts:
  base-directory: elastic-beanstalk-artifact
  files:
    - '**/*'
