name: Finitude Web release gate

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  browser-release:
    name: Unit, build, browser, and accessibility gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run server and Web unit tests
        run: npm test

      - name: Build production server and listener
        run: npm run build

      - name: Install Playwright browsers and operating-system dependencies
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run production-bundle browser and accessibility tests
        run: npm run test:e2e

      - name: Retain browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: finitude-web-browser-evidence
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 30
