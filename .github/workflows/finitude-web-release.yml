name: Finitude Web release gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# The gates run as parallel jobs so the run finishes well inside the promoter's
# 35-minute wait. One production build is shared by every browser gate and by the
# staged bundle; release-artifact runs only after every gate job succeeds.
jobs:
  build:
    name: Production build and E2E type check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      build: ${{ steps.build.outcome }}
      e2e_typecheck: ${{ steps.e2e_typecheck.outcome }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production server and listener
        id: build
        run: npm run build

      - name: Type-check browser fixtures and release specs
        id: e2e_typecheck
        run: npm run typecheck:e2e --workspace @archtree/finitude-web

      # The exact bytes tested by both browser gates are the bytes staged for release.
      # web/dist/.vite/manifest.json is hidden, so hidden files must be included.
      - name: Share the tested production build with later jobs
        uses: actions/upload-artifact@v5
        with:
          name: finitude-web-release-build
          path: |
            web/dist
            engineering/dist
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  unit-integration:
    name: Unit and Mongo-backed integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      unit: ${{ steps.unit.outcome }}
      integration: ${{ steps.integration.outcome }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the MongoDB test daemon and room audio decoder
        env:
          MONGODB_CI_VERSION: 8.0.12
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl gnupg ffmpeg
          curl -fsSL https://pgp.mongodb.com/server-8.0.asc \
            --output "${RUNNER_TEMP}/mongodb-server-8.0.asc"
          sudo gpg --batch --yes --dearmor \
            --output /usr/share/keyrings/mongodb-server-8.0.gpg \
            "${RUNNER_TEMP}/mongodb-server-8.0.asc"
          echo "deb [ arch=amd64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse" \
            | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes "mongodb-org-server=${MONGODB_CI_VERSION}"
          mongod --version

      - name: Verify the complete release runtime
        run: npm run doctor:release

      - name: Run server and Web unit tests (including Linux platform suites)
        id: unit
        run: npm test

      - name: Run Mongo-backed lifecycle integration tests
        id: integration
        if: ${{ !cancelled() }}
        run: npm run test:integration

  social-e2e:
    name: Real social MongoDB, media, and WebSocket browser tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      social: ${{ steps.social.outcome }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the MongoDB test daemon and room audio decoder
        env:
          MONGODB_CI_VERSION: 8.0.12
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl gnupg ffmpeg
          curl -fsSL https://pgp.mongodb.com/server-8.0.asc \
            --output "${RUNNER_TEMP}/mongodb-server-8.0.asc"
          sudo gpg --batch --yes --dearmor \
            --output /usr/share/keyrings/mongodb-server-8.0.gpg \
            "${RUNNER_TEMP}/mongodb-server-8.0.asc"
          echo "deb [ arch=amd64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse" \
            | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes "mongodb-org-server=${MONGODB_CI_VERSION}"
          mongod --version

      - name: Verify the complete release runtime
        run: npm run doctor:release

      - name: Use the shared production build
        uses: actions/download-artifact@v5
        with:
          name: finitude-web-release-build
          path: .

      - name: Install Playwright browsers and operating-system dependencies
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Provide isolated browser audio and display
        id: browser_environment
        run: |
          # Refresh package lists here so this step never depends on an earlier step's apt-get update.
          sudo apt-get update
          sudo apt-get install --yes pulseaudio xvfb
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=archtree_ci
          pactl set-default-sink archtree_ci
          pactl list short sinks

      # Blocking gate: every social project except the quarantined cross-engine audio drift pair below.
      - name: Run real social MongoDB, media, and WebSocket browser tests
        id: social
        env:
          # Bound the simulated device buffer; PulseAudio's default can add seconds before audio advances.
          PULSE_LATENCY_MSEC: '100'
        run: xvfb-run -a npm run test:e2e:social --workspace @archtree/finitude-web

      # QUARANTINED, NON-BLOCKING: firefox-audio-formats and webkit-audio-formats drift intermittently on real
      # Linux decoders. They still run on every attempt and keep evidence, but never fail this job or bind
      # release provenance. Rooms stay disabled in production until they return to the blocking step above
      # (docs/deployment/social-rollout-runbook.md).
      - name: Run quarantined cross-engine audio drift browser tests (non-blocking)
        id: social_quarantined
        if: ${{ !cancelled() && steps.browser_environment.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 8
        env:
          PULSE_LATENCY_MSEC: '100'
        run: xvfb-run -a npm run test:e2e:social:quarantined --workspace @archtree/finitude-web

      - name: Report quarantined cross-engine audio drift result
        if: ${{ !cancelled() && steps.social_quarantined.outcome != 'skipped' }}
        env:
          QUARANTINED_OUTCOME: ${{ steps.social_quarantined.outcome }}
        run: |
          {
            echo '### Quarantined social projects (non-blocking)'
            echo ''
            echo '`firefox-audio-formats` and `webkit-audio-formats` are quarantined from the blocking social gate.'
            echo "Outcome: **${QUARANTINED_OUTCOME}**. This result does not fail the job or enter release provenance."
            echo 'Evidence: `social-quarantined/` in the finitude-social-browser-evidence artifact.'
            echo 'Return them to the blocking gate before enabling FINITUDE_ROOMS_ENABLED (docs/deployment/social-rollout-runbook.md).'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$QUARANTINED_OUTCOME" = 'success' ]; then
            echo '::notice title=Quarantined social projects passed::firefox-audio-formats and webkit-audio-formats passed; they remain non-blocking until returned to the gate.'
          else
            echo "::warning title=Quarantined social projects ${QUARANTINED_OUTCOME} (non-blocking)::firefox-audio-formats and webkit-audio-formats did not pass. They are quarantined and do not block release; see the social-quarantined evidence."
          fi

      - name: Retain social browser evidence
        if: ${{ !cancelled() && steps.browser_environment.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: finitude-social-browser-evidence
          path: |
            web/test-results/social-real
            web/test-results/social-quarantined
          if-no-files-found: ignore
          retention-days: 30

  browser-e2e:
    name: Production-bundle browser and accessibility tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      browser: ${{ steps.browser.outcome }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use the shared production build
        uses: actions/download-artifact@v5
        with:
          name: finitude-web-release-build
          path: .

      - name: Install Playwright browsers and operating-system dependencies
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Provide isolated browser audio and display
        id: browser_environment
        run: |
          # Refresh package lists here so this step never depends on an earlier step's apt-get update.
          sudo apt-get update
          sudo apt-get install --yes pulseaudio xvfb
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=archtree_ci
          pactl set-default-sink archtree_ci
          pactl list short sinks

      - name: Run production-bundle browser and accessibility tests
        id: browser
        env:
          PULSE_LATENCY_MSEC: '100'
        run: npm run test:e2e --workspace @archtree/finitude-web -- --update-snapshots=none

      - name: Retain browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: finitude-web-browser-evidence
          path: |
            web/playwright-report
            web/test-results
            web/e2e/visual-regression.spec.ts-snapshots/linux
          if-no-files-found: ignore
          retention-days: 30

  release-artifact:
    name: Stage and retain the tested Elastic Beanstalk bundle
    # Implicit success(): skipped unless every gate job above succeeded in this run.
    needs: [build, unit-integration, social-e2e, browser-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Use the shared production build
        uses: actions/download-artifact@v5
        with:
          name: finitude-web-release-build
          path: .

      - name: Stage the Elastic Beanstalk deployment artifact
        id: staging
        run: npm run stage:eb-artifact

      - name: Create the versioned Elastic Beanstalk rollback bundle
        env:
          EB_BUNDLE_NAME: archtree-eb-${{ github.sha }}.zip
        run: |
          cd elastic-beanstalk-artifact
          zip -q -r "../${EB_BUNDLE_NAME}" \
            .archtree-eb-artifact .ebextensions .platform RELEASE.json package-lock.json package.json localization src tsconfig.json web engineering

      - name: Bind the tested bundle to this workflow attempt
        env:
          RELEASE_UNIT_RESULT: ${{ needs.unit-integration.outputs.unit }}
          RELEASE_BUILD_RESULT: ${{ needs.build.outputs.build }}
          RELEASE_E2E_TYPECHECK_RESULT: ${{ needs.build.outputs.e2e_typecheck }}
          RELEASE_SOCIAL_RESULT: ${{ needs.social-e2e.outputs.social }}
          RELEASE_INTEGRATION_RESULT: ${{ needs.unit-integration.outputs.integration }}
          RELEASE_BROWSER_RESULT: ${{ needs.browser-e2e.outputs.browser }}
          RELEASE_STAGING_RESULT: ${{ steps.staging.outcome }}
        run: node scripts/write-release-provenance.mjs

      - name: Retain the versioned Elastic Beanstalk rollback bundle
        uses: actions/upload-artifact@v5
        with:
          name: archtree-eb-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            archtree-eb-${{ github.sha }}.zip
            release-provenance.json
          if-no-files-found: error
          retention-days: 30
