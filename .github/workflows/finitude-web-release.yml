name: Finitude Web release gate

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  browser-release:
    name: Unit, build, browser, and accessibility gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run server and Web unit tests
        run: npm test

      - name: Build production server and listener
        run: npm run build

      - name: Install Playwright browsers and operating-system dependencies
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run production-bundle browser and accessibility tests
        run: npm run test:e2e

      - name: Stage the Elastic Beanstalk deployment artifact
        run: npm run stage:eb-artifact

      - name: Create the versioned Elastic Beanstalk rollback bundle
        env:
          EB_BUNDLE_NAME: archtree-eb-${{ github.sha }}.zip
        run: |
          cd elastic-beanstalk-artifact
          zip -q -r "../${EB_BUNDLE_NAME}" \
            .archtree-eb-artifact .ebextensions .platform RELEASE.json package-lock.json package.json src tsconfig.json web

      - name: Retain the versioned Elastic Beanstalk rollback bundle
        uses: actions/upload-artifact@v5
        with:
          name: archtree-eb-${{ github.sha }}
          path: archtree-eb-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Retain browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: finitude-web-browser-evidence
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 30
